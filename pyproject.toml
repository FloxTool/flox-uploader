[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flox-uploader"
version = "0.5.5"
description = "Création de packages d'upload (NFO, .torrent, fiche BBCode) pour trackers de torrents francophones."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Flox" }
]
keywords = ["torrent", "tracker", "uploader", "mediainfo", "bbcode"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "requests>=2.31",
    "torf>=4.2",
    "python-dotenv>=1.0",
    "platformdirs>=4.0",
    # Sprint D.7 v0.5.0 : extraction metadata PDF (Livre / cat 12 Gemini).
    # Pur Python, ~270 KB.
    "pypdf>=4.0",
    # Sprint D.19 v0.5.0 (note Louis Q3) : rendering pages PDF en images
    # pour cover + previews. ~30 MB mais c'est la lib la plus fiable.
    "pymupdf>=1.24",
    # Sprint D.19 : cover audiobook (MP3/M4B) depuis ID3/MP4 tags. ~600 KB.
    "mutagen>=1.47",
    # Sprint D.19 : support CBR (RAR d'images) pour BD/manga. Necessite
    # unrar.exe dans le PATH au runtime ; sinon degrade gracieusement.
    "rarfile>=4.0",
    # Sprint D.42 v0.5.0 (feedback Louis) : compression/resize des images
    # CBZ/CBR/MP3 covers avant upload imgbb. Reduit le poids fichier ~50%
    # et evite le rate-limit imgbb sur les bursts de previews. ~3 MB.
    "Pillow>=10.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "httpx>=0.27",
    "responses>=0.25",
]

[project.scripts]
flox-uploader = "flox_uploader.cli:main"

[project.urls]
Homepage = "https://github.com/FloxTool/flox-uploader"
Issues = "https://github.com/FloxTool/flox-uploader/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flox_uploader.trackers.gemini" = [
    "rules.json",
    "template.bbcode",
    "template_movie.bbcode",
    "template_episode.bbcode",
    "template_season.bbcode",
    "template_integrale.bbcode",
]
"flox_uploader.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # FastAPI on_event deprecated : connu, cf. AUDIT.md (migration vers lifespan a planifier)
    "ignore:.*on_event is deprecated.*:DeprecationWarning",
]

[tool.coverage.run]
source = ["src/flox_uploader"]
omit = [
    "*/tests/*",
    "*/web/templates/*",
    # cli.cmd_inspect appelle le tracker live, hors scope tests unitaires
    "*/cli.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
