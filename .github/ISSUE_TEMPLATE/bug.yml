name: 🐛 Bug
description: Quelque chose ne marche pas comme attendu
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce bug. Plus tu donnes de
        contexte, plus vite je peux le reproduire et le corriger.

  - type: textarea
    id: what-happened
    attributes:
      label: Ce qui s'est passé
      description: Décris le bug. Qu'est-ce que tu as fait, qu'est-ce qui s'est passé, qu'est-ce que tu attendais à la place.
      placeholder: |
        J'ai cliqué sur X, et Y est arrivé. J'attendais Z.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: Comment puis-je reproduire ce bug chez moi ?
      placeholder: |
        1. Aller sur la page /queue
        2. Cliquer sur le bouton ...
        3. Voir l'erreur
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version de Flox Uploader
      description: Visible dans la sidebar (`v0.x.y`) ou dans la page Guide → À propos
      placeholder: "0.3.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Système d'exploitation
      options:
        - Windows
        - macOS
        - Linux
        - Docker
        - Autre
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / rapport d'erreur
      description: Si l'app a affiché un message d'erreur avec un bouton "Copier rapport", colle ici. Sinon, joins le log si possible.
      render: shell

  - type: checkboxes
    id: pre-checks
    attributes:
      label: Vérifications préalables
      options:
        - label: J'ai cherché dans les issues existantes et ce bug n'y figure pas
          required: true
        - label: J'ai vérifié que je suis sur la dernière version
          required: true
