name: ✨ Feature request
description: Suggérer une nouvelle fonctionnalité ou amélioration
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Quel problème ça résout ?
      description: Décris la frustration ou le besoin actuel. Évite "ce serait cool de…" sans contexte.
      placeholder: |
        En ce moment, quand je veux X, je dois Y et Z, ce qui me prend du temps / me fait faire des erreurs.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Ce que tu proposes
      description: Comment tu vois la fonctionnalité. UX, comportement, captures éventuelles.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considérées
      description: As-tu pensé à d'autres approches ? Pourquoi tu préfères ta proposition ?

  - type: dropdown
    id: priority
    attributes:
      label: Importance pour toi
      options:
        - "Bloquant — je ne peux pas utiliser l'app sans"
        - "Important — ça améliorerait beaucoup mon workflow"
        - "Nice-to-have — pas urgent mais utile"
    validations:
      required: true

  - type: checkboxes
    id: pre-checks
    attributes:
      label: Vérifications préalables
      options:
        - label: J'ai cherché dans les issues existantes (ouvertes ET fermées) et cette feature n'y figure pas
          required: true
        - label: J'ai lu PLAN-V1.md pour vérifier que ce n'est pas déjà dans la roadmap
          required: false
