name: Build Windows .exe

# Triggers :
# - workflow_dispatch : bouton manuel "Run workflow" depuis l'onglet Actions
# - push tag v* : auto-build sur chaque release tag
# - PAS sur chaque push main (eviterait gaspiller des minutes CI)
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Opt-in Node 24 (cf. workflows/tests.yml)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-windows:
    name: PyInstaller · Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[web,dev]
          pip install pyinstaller>=6.0

      - name: Download MediaInfo CLI Windows (vendoring)
        run: python packaging/fetch_mediainfo_windows.py

      - name: Run unit tests (sanity check avant build)
        run: pytest tests/ --tb=short -q

      - name: Build .exe with PyInstaller
        run: pyinstaller packaging/flox_uploader.spec --clean --noconfirm

      - name: Show build output structure
        run: |
          echo "=== Contenu dist/ ==="
          Get-ChildItem -Path dist -Recurse -Depth 2 | Select-Object FullName, Length | Format-Table -AutoSize
          echo ""
          echo "=== Taille totale du bundle ==="
          $size = (Get-ChildItem -Path 'dist/Flox Uploader' -Recurse | Measure-Object -Property Length -Sum).Sum
          $mb = [math]::Round($size / 1MB, 1)
          echo "Bundle = $mb MB"
        shell: pwsh

      - name: Smoke test 1 — --help fonctionne (argparse OK)
        run: |
          $proc = Start-Process -FilePath 'dist/Flox Uploader/Flox Uploader.exe' -ArgumentList '--help' -PassThru -NoNewWindow -Wait -RedirectStandardOutput stdout.txt -RedirectStandardError stderr.txt
          echo "--- stdout ---"
          Get-Content stdout.txt -ErrorAction SilentlyContinue
          echo "--- stderr ---"
          Get-Content stderr.txt -ErrorAction SilentlyContinue
          if ($proc.ExitCode -ne 0) {
            echo "::error::--help failed avec exit code $($proc.ExitCode)"
            exit 1
          }
          echo "OK : --help fonctionne (exit $($proc.ExitCode))"
        shell: pwsh

      - name: Smoke test 2 — boot complet uvicorn (detecte les ImportError)
        # On lance le serveur 5s puis on le tue. Ca exerce le code path qui
        # importe le module flox_uploader, FastAPI, uvicorn, jinja2, etc.
        # Si un hidden import manque, on plante ici (vs --help qui n'a pas
        # encore importe le serveur).
        run: |
          $proc = Start-Process -FilePath 'dist/Flox Uploader/Flox Uploader.exe' -ArgumentList '--no-browser','--port','18765' -PassThru -NoNewWindow -RedirectStandardOutput boot_stdout.txt -RedirectStandardError boot_stderr.txt
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            echo "::error::Le serveur s'est arrete avant la fin du sleep (crash boot)"
            echo "--- stdout ---"
            Get-Content boot_stdout.txt -ErrorAction SilentlyContinue
            echo "--- stderr ---"
            Get-Content boot_stderr.txt -ErrorAction SilentlyContinue
            exit 1
          }
          # Verifier que uvicorn a bien demarre (cherche la signature dans stdout)
          $bootLog = Get-Content boot_stdout.txt -Raw -ErrorAction SilentlyContinue
          $stderrLog = Get-Content boot_stderr.txt -Raw -ErrorAction SilentlyContinue
          echo "--- stdout ---"
          Write-Output $bootLog
          echo "--- stderr ---"
          Write-Output $stderrLog
          Stop-Process -Id $proc.Id -Force
          # Verification du contenu : si stderr contient ImportError / Traceback / unhandled
          if ($stderrLog -match "ImportError|attempted relative import|ModuleNotFoundError|unhandled exception") {
            echo "::error::Boot a detecte une erreur d'import"
            exit 1
          }
          if ($bootLog -notmatch "Uvicorn running") {
            echo "::error::Uvicorn n'a pas demarre (signature 'Uvicorn running' absente du stdout)"
            exit 1
          }
          echo "OK : serveur a demarre proprement et a ete arrete"
        shell: pwsh

      - name: Zip the bundle for artifact upload
        run: |
          $version = python -c "from flox_uploader import __version__; print(__version__)"
          $zipName = "FloxUploader-$version-Windows-x64.zip"
          Compress-Archive -Path 'dist/Flox Uploader/*' -DestinationPath "$zipName" -CompressionLevel Optimal
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          $zipSize = [math]::Round((Get-Item $zipName).Length / 1MB, 1)
          echo "ZIP genere : $zipName ($zipSize MB)"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flox-uploader-windows
          path: ${{ env.ZIP_NAME }}
          retention-days: 30

      # Pour les pushes de tag : on attache le ZIP a la GitHub Release
      # automatiquement. Si la release n'existe pas encore (premier push tag),
      # softprops/action-gh-release la cree.
      - name: Attach to GitHub Release (sur tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          draft: true                       # on revoit le contenu avant publication
          generate_release_notes: true      # auto-generate from commits since prev tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
